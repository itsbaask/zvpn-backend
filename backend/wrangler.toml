name = "vpn-backend"
main = "index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[vars]
# Public non-sensitive config vars go here (if any)

[[r2_buckets]]
binding = "PUBLICVPN_BUCKET"
bucket_name = "publicvpnlist-profiles"

[[kv_namespaces]]
binding = "VPN_DATA"
id = "73219165768a41b6bb2f920ecb41ec06"

# ─── Secrets ────────────────────────────────────────────────────────────────
# These must be set via Wrangler CLI — never commit real values here.
# Run once per environment:
#
#   npx wrangler secret put API_SECRET
#   npx wrangler secret put BACKEND_SECRET_KEY
#   npx wrangler secret put UNITY_S2S_SECRET
#
# API_SECRET / BACKEND_SECRET_KEY  →  used to authenticate POST /upload from the Python sync pipeline
# UNITY_S2S_SECRET                 →  used to verify Unity Ads S2S reward HMAC signatures
# ────────────────────────────────────────────────────────────────────────────
