name: VPN Sources Sync and Prune

on:
  schedule:
    - cron: '0 */6 * * *'  # Runs every 6 hours
  workflow_dispatch:      # Allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 selenium undetected-chromedriver

      - name: Run Enterprise Sync and Mirror Prune Engine
        run: |
          python sync_backend.py

      - name: Commit and Push Updated Servers
        run: |
          git config --global user.name "ZVPN Bot"
          git config --global user.email "bot@zvpn.net"
          git add output/servers.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-sync VPN servers (Mirror update) [skip ci]" && git pull --rebase origin rebrand/zvpn && git push origin rebrand/zvpn)
